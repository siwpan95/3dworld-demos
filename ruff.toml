# 3dworld-demos —— 静态门禁配置（与引擎仓 3dworld/pyproject.toml 的 [tool.ruff] 同口径）
#
# 为什么现在才有这个文件
# ----------------------
# `requirements-dev.txt` 从建仓起就写着「本仓随之使用与引擎一致的 select = ["F", "E9"] /
# line-length 100」，但仓内一直没有配置文件 —— 于是 `ruff check .` 走的是默认规则集
# （801 error，绝大部分是 E501 行宽与 demo 里刻意的长行），**门禁命令实际不可复现**。
# 2026-11-22 M0 补上，只为让既有声明落地，不新增代码约束。
#
# 与引擎一致的三条 ignore 的理由（引自引擎仓注释）
# ----------------------------------------------
# 引擎侧原话：「上线前全检跑出 931 项告警（BLE001 盲目 except / F401 未用导入 /
# S110 try-except-pass）。门禁先只钉住"能抓到真缺陷"的几条（F811 重复定义正是它
# 抓到了 voxel_terrain 被覆盖的 update）。」
# 本仓 demo 大量使用 star-import 与"导入即导出"（薄壳演示），F401/F403/F405 在此
# 语境下是设计而非缺陷，故与引擎保持同一口径。

line-length = 100
target-version = "py311"

[lint]
select = ["F", "E9"]
ignore = ["F401", "F403", "F405"]
